<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión EN VIVO - NIU PLAY</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; background-color: #000; overflow: hidden;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
        /* Un pequeño texto de carga mientras conecta */
        #cargando {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; z-index: -1;
        }
    </style>
</head>
<body>

    <div id="cargando">Conectando a la señal en vivo...</div>
    
    <iframe id="pantallaPartido" allowfullscreen allow="autoplay"></iframe>

    <script>
        // 1. Buscamos primero si la app de Android nos manda el link por parámetros de URL
        const parametros = new URLSearchParams(window.location.search);
        const linkDesdeAndroid = parametros.get('urlPartido');
        
        // 2. Si no viene de Android, lo buscamos en la memoria (para tu proyecto web)
        const linkSecreto = linkDesdeAndroid || sessionStorage.getItem('urlPartido');

        if (linkSecreto) {
            // 3. Se lo inyectamos al iframe
            document.getElementById('pantallaPartido').src = linkSecreto;
            
            // 4. Borramos la evidencia de la memoria (¡Hack de seguridad!)
            sessionStorage.removeItem('urlPartido');
        } else {
            // Si alguien intenta entrar a esta página directamente sin dar clic en tu menú
            document.getElementById('cargando').innerText = "❌ Error: Transmisión no autorizada.";
        }
    </script>
    <script>
        // 1. Bloquear el Clic Derecho (Menú contextual)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. Bloquear atajos de teclado clásicos de los curiosos
        document.onkeydown = function(e) {
            // Bloquea F12
            if (e.keyCode === 123) {
                return false;
            }
            // Bloquea Ctrl+Shift+I (Herramientas de desarrollador)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                return false;
            }
            // Bloquea Ctrl+Shift+J (Consola)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                return false;
            }
            // Bloquea Ctrl+U (Ver código fuente)
            if (e.ctrlKey && e.keyCode === 85) {
                return false;
            }
            // Bloquea Ctrl+S (Guardar página)
            if (e.ctrlKey && e.keyCode === 83) {
                return false;
            }
        };

        // 3. Trampa activa contra la Consola de Desarrollador (DevTools)
        // Si alguien logra abrirla de alguna forma, el navegador se trabará en un bucle infinito
        setInterval(function() {
            const inicio = new Date().getTime();
            debugger; // Detiene la ejecución si tienen las DevTools abiertas
            const fin = new Date().getTime();
            
            // Si el código tardó en pasar el "debugger", significa que la consola estaba abierta
            if (fin - inicio > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>Acceso Denegado. Se ha detectado manipulación del código.</h1>";
                // Opcional: Redirigirlos a Google
                // window.location.href = "https://www.google.com";
            }
        }, 1000);

        // 4. Evitar que arrastren o copien elementos (como los posters)
        document.ondragstart = function() { return false; };
        document.onselectstart = function() { return false; };
    </script>
</body>
</html>
