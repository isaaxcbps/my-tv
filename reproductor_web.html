<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viendo Contenido - NIU PLAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Evita barras de desplazamiento */
            font-family: 'Poppins', sans-serif;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .btn-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.3);
            font-weight: bold;
            font-size: 14px;
            backdrop-filter: blur(5px);
            z-index: 9999; /* Para que siempre quede por encima del video */
            transition: all 0.2s ease;
        }
        
        /* Efecto al pasar el mouse o usar el control de la TV */
        .btn-volver:hover, .btn-volver:focus {
            transform: scale(1.05);
            background: #E50914; /* Rojo tipo Netflix */
            border-color: transparent;
            outline: none;
        }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="btn-volver">⬅ Volver</a>
    
    <iframe id="pantallaWeb" allowfullscreen allow="autoplay" referrerpolicy="origin"></iframe>

    <script>
        // 1. Obtenemos la URL de la película o capítulo que viene del clic
        const params = new URLSearchParams(window.location.search);
        const urlWeb = decodeURIComponent(params.get('video'));
        
        // 2. Se la inyectamos al iframe
        if (urlWeb && urlWeb !== "null") {
            document.getElementById('pantallaWeb').src = urlWeb;
        } else {
            alert("Error: No se encontró el enlace del video.");
            window.location.href = "index.html"; // Rescate si algo sale mal
        }
    </script>
    <script>
        // 1. Bloquear el Clic Derecho (Menú contextual)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. Bloquear atajos de teclado clásicos de los curiosos
        document.onkeydown = function(e) {
            // Bloquea F12
            if (e.keyCode === 123) {
                return false;
            }
            // Bloquea Ctrl+Shift+I (Herramientas de desarrollador)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                return false;
            }
            // Bloquea Ctrl+Shift+J (Consola)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                return false;
            }
            // Bloquea Ctrl+U (Ver código fuente)
            if (e.ctrlKey && e.keyCode === 85) {
                return false;
            }
            // Bloquea Ctrl+S (Guardar página)
            if (e.ctrlKey && e.keyCode === 83) {
                return false;
            }
        };

        // 3. Trampa activa contra la Consola de Desarrollador (DevTools)
        // Si alguien logra abrirla de alguna forma, el navegador se trabará en un bucle infinito
        setInterval(function() {
            const inicio = new Date().getTime();
            debugger; // Detiene la ejecución si tienen las DevTools abiertas
            const fin = new Date().getTime();
            
            // Si el código tardó en pasar el "debugger", significa que la consola estaba abierta
            if (fin - inicio > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>Acceso Denegado. Se ha detectado manipulación del código.</h1>";
                // Opcional: Redirigirlos a Google
                // window.location.href = "https://www.google.com";
            }
        }, 1000);

        // 4. Evitar que arrastren o copien elementos (como los posters)
        document.ondragstart = function() { return false; };
        document.onselectstart = function() { return false; };
    </script>
</body>
</html>
