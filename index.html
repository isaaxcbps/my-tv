<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIU PLAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. VARIABLES Y BASE --- */
        :root {
            --primary: #E50914; /* Rojo Netflix */
            --dark: #141414;    /* Fondo Oscuro */
            --gray: #333;
            --light: #fff;
        }

        body { 
            background-color: var(--dark); 
            color: var(--light); 
            font-family: 'Poppins', sans-serif; 
            margin: 0; padding: 0;
            overflow-x: hidden; 
        }

        /* --- 2. CABECERA (HEADER) --- */
        header {
            padding: 20px;
            position: sticky; top: 0; z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 100%);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .header-top {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }

        h1 { 
            margin: 0; color: var(--primary); font-size: 28px; 
            letter-spacing: 1px; text-shadow: 0 2px 4px black; font-weight: 700;
        }

        #buscador {
            background: var(--gray); border: 1px solid #444; color: white;
            padding: 10px 15px; border-radius: 50px; width: 40%; max-width: 300px;
            transition: all 0.3s ease; font-family: inherit;
        }
        #buscador:focus { 
            width: 50%; outline: none; border-color: var(--primary); background: #444; 
        }

        /* --- 3. PESTAÑAS (MENÚ) --- */
        .tabs {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
            scrollbar-width: none; 
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ddd;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tab-btn:hover, .tab-btn:focus { 
            background: rgba(255,255,255,0.3); 
            transform: scale(1.05);
            outline: none; border-color: white;
        }
        
        .tab-btn.activo {
            background: var(--light); color: var(--dark);
            font-weight: 600; border-color: var(--light);
        }

        /* --- NUEVO: FILTROS AVANZADOS (AÑO Y GÉNERO) --- */
        .filtros-avanzados {
            display: flex; gap: 15px; margin-top: 5px;
        }

        .filtro-select {
            background: rgba(255,255,255,0.05);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }

        .filtro-select:focus, .filtro-select:hover {
            border-color: var(--primary);
            background: rgba(255,255,255,0.1);
        }

        /* Para que las opciones dentro del select se vean legibles en fondo oscuro */
        .filtro-select option {
            background-color: var(--dark);
            color: white;
        }

        /* --- 4. GRILLA DE PELÍCULAS --- */
        .contenedor-principal { padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        .galeria { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; 
            padding-bottom: 30px;
        }

        /* --- 5. TARJETAS (POSTERS) --- */
        .tarjeta { 
            position: relative; border-radius: 8px; overflow: hidden; 
            cursor: pointer; transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            aspect-ratio: 2/3; 
            background: #222;
            border: 2px solid transparent;
        }

        .tarjeta:hover, .tarjeta:focus { 
            transform: scale(1.1); 
            z-index: 10; 
            box-shadow: 0 0 25px rgba(229,9,20,0.6); 
            border-color: white; 
            outline: none;
        }
        
        .tarjeta img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
        
        .titulo-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,1), transparent);
            padding: 10px; font-size: 13px; text-align: center;
            font-weight: 600; text-shadow: 0 1px 3px black;
            opacity: 1; 
        }

        .badge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(229, 9, 20, 0.9); padding: 3px 8px;
            border-radius: 4px; font-size: 10px; font-weight: bold;
            color: white; box-shadow: 0 2px 5px black; z-index: 5;
            text-transform: uppercase;
        }

        /* --- 6. BOTÓN CARGAR MÁS --- */
        .btn-cargar-mas {
            display: block; margin: 20px auto 50px auto; padding: 12px 30px;
            background-color: var(--primary); color: white; border: none;
            border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(229,9,20,0.4);
        }
        .btn-cargar-mas:hover {
            background-color: #b20710; transform: scale(1.05);
        }

        /* Ajustes Móvil */
        @media (max-width: 600px) {
            .galeria { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
            h1 { font-size: 22px; }
            #buscador { width: 150px; }
            .filtros-avanzados { flex-direction: column; gap: 8px; }
            .filtro-select { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>NIU PLAY</h1>
            <input type="text" id="buscador" placeholder="Buscar...">
        </div>
        
        <div class="tabs">
            <button class="tab-btn activo" onclick="cambiarCategoria('TODO')">Todo</button>
            <button class="tab-btn" onclick="cambiarCategoria('PELICULA')">Películas</button>
            <button class="tab-btn" onclick="cambiarCategoria('SERIE')">Series and Anime</button>
            <button class="tab-btn" onclick="cambiarCategoria('RADIO')">Radio</button>
            <button class="tab-btn" onclick="window.location.href='deportes.html'">Deportes</button>
        </div>

        <div class="filtros-avanzados">
            <select id="filtro-genero" class="filtro-select">
                <option value="TODOS">Todos los Géneros</option>
            </select>
            <select id="filtro-anio" class="filtro-select">
                <option value="TODOS">Todos los Años</option>
            </select>
        </div>
    </header>

    <div class="contenedor-principal">
        <div class="galeria" id="contenedor-peliculas">
            </div>
            
        <button id="btn-cargar-mas" class="btn-cargar-mas" style="display: none;" onclick="cargarMas()">
            ⬇ Cargar más contenido
        </button>
        
        <div id="sin-resultados" style="display:none; text-align:center; margin-top:50px; color:#777;">
            <p>☹️ No encontramos contenido con esos filtros.</p>
        </div>
    </div>

    <script>
        const contenedor = document.getElementById('contenedor-peliculas');
        const buscador = document.getElementById('buscador');
        const btnCargarMas = document.getElementById('btn-cargar-mas'); 
        
        // Elementos de Filtro
        const filtroGenero = document.getElementById('filtro-genero');
        const filtroAnio = document.getElementById('filtro-anio');
        
        let peliculasDB = [];
        let categoriaActual = 'TODO';
        
        // --- VARIABLES DE PAGINACIÓN ---
        let paginaActual = 1;
        const itemsPorPagina = 24; 

        // 1. CARGA DE DATOS
        Promise.all([
            fetch('peliculas_con_posters.json').then(res => res.json()).catch(err => []), 
            fetch('series.json').then(res => res.json()).catch(err => []),     
            fetch('anime.json').then(res => res.json()).catch(err => []),
            fetch('series_estructuradas.json').then(res => res.json()).catch(err => []),
            fetch('deportes.json').then(res => res.json()).catch(err => [])
        ])
        .then(resultados => {
            peliculasDB = resultados.flat();
            console.log("Catálogo total cargado:", peliculasDB.length, "títulos."); 
            
            // Ejecutar el motor de filtros dinámicos
            poblarFiltrosDinamicos();
            
            renderizar(true); 
        })
        .catch(err => {
            console.error("Error cargando archivos:", err);
            contenedor.innerHTML = '<h3 style="text-align:center; margin-top:20px;">Error cargando datos. Revisa la consola (F12).</h3>';
        });

        // --- NUEVA FUNCIÓN: EXTRACTOR AUTOMÁTICO DE AÑOS Y GÉNEROS ---
        function poblarFiltrosDinamicos() {
            let generosUnicos = new Set();
            let aniosUnicos = new Set();

            peliculasDB.forEach(item => {
                // Sacar años válidos
                if (item.anio && item.anio !== "Desconocido") {
                    aniosUnicos.add(item.anio);
                }
                // Sacar géneros válidos (separando si vienen como "Acción / Comedia")
                if (item.genero && item.genero !== "Desconocido") {
                    let listaGeneros = item.genero.split('/');
                    listaGeneros.forEach(g => {
                        let genLimpio = g.trim();
                        if(genLimpio !== "") generosUnicos.add(genLimpio);
                    });
                }
            });

            // Ordenar alfabéticamente (Géneros) y de más nuevo a más viejo (Años)
            let generosOrdenados = Array.from(generosUnicos).sort();
            let aniosOrdenados = Array.from(aniosUnicos).sort((a, b) => b - a);

            // Inyectar en el HTML
            generosOrdenados.forEach(g => {
                filtroGenero.innerHTML += `<option value="${g}">${g}</option>`;
            });
            aniosOrdenados.forEach(a => {
                filtroAnio.innerHTML += `<option value="${a}">${a}</option>`;
            });
        }

        // 2. RENDERIZADO INTELIGENTE Y FILTRADO COMBINADO
        function renderizar(reiniciarPagina = false) {
            if (reiniciarPagina) {
                paginaActual = 1;
                contenedor.innerHTML = '';
            }

            const textoBusqueda = buscador.value.toLowerCase();
            const valGenero = filtroGenero.value;
            const valAnio = filtroAnio.value;

            const filtrados = peliculasDB.filter(item => {
                // Filtro 1: Categoría (Pestañas)
                const catItem = item.categoria ? item.categoria.toUpperCase() : 'OTROS';
                const pasaCategoria = (categoriaActual === 'TODO') || (catItem === categoriaActual);
                
                // Filtro 2: Buscador de texto
                const pasaTexto = item.titulo.toLowerCase().includes(textoBusqueda);
                
                // Filtro 3: Año
                const pasaAnio = (valAnio === 'TODOS') || (item.anio === valAnio);
                
                // Filtro 4: Género (usamos .includes() por si la película tiene varios géneros)
                const pasaGenero = (valGenero === 'TODOS') || (item.genero && item.genero.includes(valGenero));

                return pasaCategoria && pasaTexto && pasaAnio && pasaGenero;
            });

            document.getElementById('sin-resultados').style.display = filtrados.length === 0 ? 'block' : 'none';

            // Paginación
            const inicio = (paginaActual - 1) * itemsPorPagina;
            const fin = paginaActual * itemsPorPagina;
            const loteAMostrar = filtrados.slice(inicio, fin); 

            loteAMostrar.forEach(item => {
                const card = document.createElement('div');
                card.className = 'tarjeta';
                card.setAttribute('tabindex', '0'); 
                
                const abrirContenido = () => {
                    if (item.categoria === 'SERIE') {
                        if(item.id) {
                            window.location.href = `detalles.html?id=${item.id}`;
                        } else {
                            alert("Error: Esta serie no tiene ID configurado.");
                        }
                    } else {
                        if (item.url.includes('vimeus.com')) {
                            window.location.href = `reproductor_web.html?video=${encodeURIComponent(item.url)}&titulo=${encodeURIComponent(item.titulo)}`;
                        }
                        else if (item.url.includes('.php') || item.url.includes('.html')) {
                            window.open(item.url, '_blank'); 
                        } 
                        else if (item.url.startsWith('http:')) {
                            window.location.href = `reproductorhttp.html?video=${encodeURIComponent(item.url)}&titulo=${encodeURIComponent(item.titulo)}`;
                        } 
                        else {
                            window.location.href = `reproductor.html?video=${encodeURIComponent(item.url)}&titulo=${encodeURIComponent(item.titulo)}`;
                        }
                    }
                };

                card.onclick = abrirContenido;
                card.onkeydown = (e) => {
                    if (e.key === 'Enter') abrirContenido();
                };

                const img = item.foto || 'https://via.placeholder.com/200x300?text=NIU';
                
                card.innerHTML = `
                    <div class="badge">${item.categoria || ''}</div>
                    <img src="${img}" loading="lazy" alt="${item.titulo}">
                    <div class="titulo-overlay">${item.titulo}</div>
                `;
                contenedor.appendChild(card);
            });

            if (fin >= filtrados.length) {
                btnCargarMas.style.display = 'none'; 
            } else {
                btnCargarMas.style.display = 'block'; 
            }
        }

        // 3. ACCIÓN DEL BOTÓN CARGAR MÁS
        function cargarMas() {
            paginaActual++;
            renderizar(false); 
        }

        // 4. CAMBIAR CATEGORÍA
        function cambiarCategoria(nuevaCat) {
            categoriaActual = nuevaCat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('activo');
                if(btn.innerText.toUpperCase().includes(nuevaCat) || 
                   (nuevaCat === 'TODO' && btn.innerText === 'Todo')) {
                    btn.classList.add('activo');
                }
            });
            renderizar(true); 
        }

        // 5. EVENTOS DE BÚSQUEDA Y FILTROS
        buscador.addEventListener('input', () => renderizar(true));
        filtroGenero.addEventListener('change', () => renderizar(true));
        filtroAnio.addEventListener('change', () => renderizar(true));

    </script>
    <script>
        // 1. Bloquear el Clic Derecho (Menú contextual)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. Bloquear atajos de teclado clásicos de los curiosos
        document.onkeydown = function(e) {
            // Bloquea F12
            if (e.keyCode === 123) {
                return false;
            }
            // Bloquea Ctrl+Shift+I (Herramientas de desarrollador)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                return false;
            }
            // Bloquea Ctrl+Shift+J (Consola)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                return false;
            }
            // Bloquea Ctrl+U (Ver código fuente)
            if (e.ctrlKey && e.keyCode === 85) {
                return false;
            }
            // Bloquea Ctrl+S (Guardar página)
            if (e.ctrlKey && e.keyCode === 83) {
                return false;
            }
        };

        // 3. Trampa activa contra la Consola de Desarrollador (DevTools)
        // Si alguien logra abrirla de alguna forma, el navegador se trabará en un bucle infinito
        setInterval(function() {
            const inicio = new Date().getTime();
            debugger; // Detiene la ejecución si tienen las DevTools abiertas
            const fin = new Date().getTime();
            
            // Si el código tardó en pasar el "debugger", significa que la consola estaba abierta
            if (fin - inicio > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>Acceso Denegado. Se ha detectado manipulación del código.</h1>";
                // Opcional: Redirigirlos a Google
                // window.location.href = "https://www.google.com";
            }
        }, 1000);

        // 4. Evitar que arrastren o copien elementos (como los posters)
        document.ondragstart = function() { return false; };
        document.onselectstart = function() { return false; };
    </script>
</body>
</html>
